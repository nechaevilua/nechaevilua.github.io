<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Швейцарский нож трейдера · v16.0.0 «HTX Net»</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="lib/echarts.min.js"></script>
    <script src="lib/html2canvas.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0c14; font-family: Arial, sans-serif; color: #fff; padding: 20px; min-height: 100vh; }
      .container { max-width: 1400px; margin: 0 auto; }
      .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: #141b2b; padding: 16px 24px; border-radius: 24px; border: 1px solid #253248; margin-bottom: 20px; }
      .header h2 { font-size: 18px; margin: 0; }
      .header h2 span { font-size: 14px; color: #8899bb; }
      .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .filters input, .filters select { background: #1a2335; border: 1px solid #2a3448; padding: 5px 8px; color: #fff; border-radius: 6px; font-size: 12px; }
      .filters input { width: 90px; }
      .filters select { min-width: 70px; }
      .filters button { background: #00aa55; border: none; color: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
      .filters button:hover { opacity: 0.85; }
      .filters .btn-fav { background: #8800ff; }
      .filters .btn-pred { background: #ff6600; }
      .filters .btn-pred.active { background: #ff8800; box-shadow: 0 0 20px rgba(255, 100, 0, 0.3); }
      .filters .btn-train { background: #00aaff; }
      .filters .btn-train.active { background: #00ccff; box-shadow: 0 0 20px rgba(0, 170, 255, 0.3); }
      .filters .btn-train.off { background: #445566; color: #8899bb; }
      .filters .btn-sort { background: #445566; color: #8899bb; min-width: 120px; }
      .filters .btn-sort.asc { background: #aa44ff; color: #fff; box-shadow: 0 0 20px rgba(170, 68, 255, 0.3); }
      .filters .btn-sort.desc { background: #ff44aa; color: #fff; box-shadow: 0 0 20px rgba(255, 68, 170, 0.3); }
      .filters .btn-screenshot { background: #ff8800; color: #fff; }
      .filters .btn-screenshot:hover { background: #ffaa44; }
      .filters .btn-setup { background: #ff6600; color: #fff; min-width: 100px; }
      .filters .btn-setup.active { background: #ff8800; box-shadow: 0 0 20px rgba(255, 100, 0, 0.4); }
      .filters .btn-setup.off { background: #445566; color: #8899bb; }
      .filters .btn-trend { background: #00aa55; color: #fff; min-width: 100px; }
      .filters .btn-trend.active { background: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
      .filters .btn-trend.off { background: #445566; color: #8899bb; }
      .filters .btn-moment { background: #aa00ff; color: #fff; min-width: 100px; transition: 0.2s; }
      .filters .btn-moment:hover { opacity: 0.85; }
      .filters .btn-moment.active { background: #cc44ff; box-shadow: 0 0 25px rgba(170, 0, 255, 0.6); }
      .filters .btn-json { background: #00aaff; color: #fff; min-width: 80px; }
      .filters .btn-json:hover { background: #22ccff; }
      .status { background: #1a2335; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
      .status .stat-item { display: flex; align-items: center; gap: 5px; }
      .status .stat-item .badge { background: #2a3448; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
      .status .stat-item .badge.setup { background: #1a2a00; color: #ffaa00; border: 1px solid #ffaa00; }
      .progress-container { background: #1a2335; padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; display: none; }
      .time-remaining { font-size: 22px; font-weight: bold; color: #00ffaa; margin-bottom: 4px; }
      .progress-bar { height: 8px; background: #2a3448; border-radius: 4px; overflow: hidden; }
      .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00ffaa, #ffaa00); transition: width 0.5s; }
      .pagination { display: flex; justify-content: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; align-items: center; }
      .pagination button { background: #1a2335; border: 1px solid #2a3448; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
      .pagination button:hover { background: #2a3448; border-color: #8800ff; }
      .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
      .pagination .page-info { color: #8899bb; font-size: 13px; padding: 0 10px; }
      .pagination .stat-train { color: #ffaa00; font-weight: bold; font-size: 14px; }
      .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
      .coin-item { background: #141b2b; padding: 14px 12px; border-radius: 10px; border: 1px solid #253248; transition: 0.2s; position: relative; display: flex; flex-direction: column; }
      .coin-item:hover { border-color: #8800ff; z-index: 2; }
      .coin-item.success { background: #003d22; border-color: #00ffaa; order: -1; }
      .coin-item.success .coin-gain { color: #00ffaa !important; }
      .coin-item.favorite { border-color: #ffaa00; border-width: 2px; background: #1a2a00; }
      .coin-item.predicted { background: #1a2a00; border-color: #ff8800; border-width: 2px; }
      .coin-item.predicted .coin-gain { color: #ffaa00 !important; }
      .coin-item.predicted-correct { background: #003d22; border-color: #00ffaa; border-width: 3px; }
      .coin-item.predicted-correct .coin-gain { color: #00ffaa !important; }
      .coin-item.predicted-wrong { background: #3d0015; border-color: #ff4466; border-width: 3px; }
      .coin-item.predicted-wrong .coin-gain { color: #ff4466 !important; }
      .coin-item.setup { background: #1a2a00; border-color: #ffaa00; border-width: 2px; order: -2; }
      .coin-item.setup .coin-gain { color: #ffaa00 !important; }
      .coin-item.setup-strong { background: #1a3a00; border-color: #ff8800; border-width: 3px; box-shadow: 0 0 30px rgba(255, 136, 0, 0.2); }
      .coin-item.setup-strong .coin-gain { color: #ff8800 !important; }
      .coin-item.trend { background: #002a1a; border-color: #00ffaa; border-width: 2px; order: -2; }
      .coin-item.trend .coin-gain { color: #00ffaa !important; }
      .coin-item.early-trend { background: #002a1a; border-color: #00ffaa; border-width: 3px; box-shadow: 0 0 35px rgba(0, 255, 170, 0.3); order: -3; }
      .coin-item.early-trend .coin-gain { color: #00ffaa !important; }
      .coin-item.consolidation { background: #1a2a00; border-color: #ffaa00; border-width: 2px; order: -2; }
      .coin-item.consolidation .coin-gain { color: #ffaa00 !important; }
      .coin-item.form { background: #1a2a00; border-color: #ffaa00; border-width: 2px; }
      .coin-item.form .coin-gain { color: #ffaa00 !important; }
      .coin-item.form-strong { background: #2a3a00; border-color: #ffcc00; border-width: 3px; box-shadow: 0 0 30px rgba(255, 204, 0, 0.3); }
      .coin-item.form-strong .coin-gain { color: #ffdd00 !important; }
      .coin-item.rank-1 { background: #2a1a00; border-color: #ffd700; border-width: 4px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
      .coin-item.rank-2 { background: #1a1a2a; border-color: #c0c0c0; border-width: 3px; box-shadow: 0 0 20px rgba(192, 192, 192, 0.3); }
      .coin-item.rank-3 { background: #2a1500; border-color: #cd7f32; border-width: 3px; box-shadow: 0 0 20px rgba(205, 127, 50, 0.3); }
      .coin-item .rank-badge { position: absolute; top: 6px; left: 8px; font-size: 24px; z-index: 6; line-height: 1; cursor: pointer; transition: 0.2s; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6)); }
      .coin-item .rank-badge:hover { transform: scale(1.3); }
      .coin-item.rank-1 .coin-gain { color: #ffd700 !important; }
      .coin-item.rank-2 .coin-gain { color: #e0e0e0 !important; }
      .coin-item.rank-3 .coin-gain { color: #cd7f32 !important; }
      .coin-item .fav-star { position: absolute; top: 6px; right: 8px; background: rgba(26, 35, 53, 0.9); border: 1px solid #2a3448; color: #8899bb; border-radius: 6px; padding: 2px 8px; font-size: 18px; cursor: pointer; z-index: 5; transition: 0.2s; line-height: 1.3; }
      .coin-item .fav-star:hover { color: #ffaa00; border-color: #ffaa00; transform: scale(1.1); }
      .coin-item .fav-star.active { color: #ffaa00; border-color: #ffaa00; text-shadow: 0 0 16px rgba(255, 170, 0, 0.5); }
      .coin-item .top-badges { position: absolute; top: 6px; left: 44px; display: flex; gap: 4px; z-index: 3; flex-wrap: wrap; max-width: calc(100% - 96px); }
      .coin-item .top-badges .badge-icon { font-size: 16px; line-height: 1.2; background: rgba(10, 12, 20, 0.7); padding: 1px 4px; border-radius: 4px; }
      .coin-item .top-badges .badge-icon.setup-badge { color: #ffaa00; background: rgba(26, 42, 0, 0.9); border: 1px solid #ffaa00; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .top-badges .badge-icon.setup-strong-badge { color: #ff8800; background: rgba(26, 42, 0, 0.9); border: 2px solid #ff8800; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; box-shadow: 0 0 20px rgba(255, 136, 0, 0.2); }
      .coin-item .top-badges .badge-icon.early-badge { color: #00ffaa; background: rgba(0, 42, 26, 0.95); border: 2px solid #00ffaa; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; box-shadow: 0 0 25px rgba(0, 255, 170, 0.3); }
      .coin-item .top-badges .badge-icon.trend-badge { color: #00ffaa; background: rgba(0, 42, 26, 0.9); border: 1px solid #00ffaa; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .top-badges .badge-icon.consolidation-badge { color: #ffaa00; background: rgba(26, 42, 0, 0.9); border: 1px solid #ffaa00; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .top-badges .badge-icon.form-badge { color: #ffdd00; background: rgba(58, 46, 0, 0.9); border: 1px solid #ffcc00; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .top-badges .badge-icon.form-strong-badge { color: #ffdd00; background: rgba(58, 46, 0, 0.95); border: 2px solid #ffcc00; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
      .coin-item .top-badges .badge-icon.asian-badge { color: #ff66aa; background: rgba(58, 0, 29, 0.95); border: 2px solid #ff3388; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .top-badges .badge-icon.pre-moment-badge { color: #ffdd00; background: rgba(58, 46, 0, 0.95); border: 2px solid #ffcc00; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }
      .coin-item .top-badges .badge-icon.micro-strong { color: #00ffaa; background: rgba(0, 42, 26, 0.95); border: 2px solid #00ffaa; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; box-shadow: 0 0 20px rgba(0, 255, 170, 0.5); }
      .coin-item .top-badges .badge-icon.micro-mid { color: #ffaa00; background: rgba(42, 26, 0, 0.95); border: 2px solid #ffaa00; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .top-badges .badge-icon.micro-weak { color: #ff4466; background: rgba(58, 0, 15, 0.95); border: 2px solid #ff4466; padding: 1px 6px; font-size: 11px; font-weight: bold; border-radius: 10px; }
      .coin-item .chart-toggle-btn { background: #445566; border: none; color: #8899bb; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; transition: 0.2s; }
      .coin-item .chart-toggle-btn:hover { background: #556677; color: #fff; }
      .coin-item .chart-toggle-btn.active { background: #00ffaa; color: #000; }
      .coin-item .coin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-right: 32px; padding-top: 34px; }
      .coin-item .coin-symbol { cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; user-select: none; }
      .coin-item .coin-symbol:hover { color: #00ffaa; }
      .coin-item .coin-price-info { display: flex; gap: 12px; font-size: 13px; color: #8899bb; margin-bottom: 6px; flex-wrap: wrap; }
      .coin-item .coin-gain { font-size: 18px; font-weight: bold; }
      .coin-item .coin-chart { height: 340px; width: 100%; margin: 4px 0; cursor: pointer; flex-shrink: 0; }
      .coin-item .coin-chart .chart-container { width: 100%; height: 280px; }
      .coin-item .coin-chart .vol-container { width: 100%; height: 55px; margin-top: -2px; }
      .coin-item .coin-chart canvas { width: 100%; height: 100%; display: block; border-radius: 4px; background: #0a0c14; }
      .coin-item .progress-micro { background: #2a3448; border-radius: 3px; height: 4px; margin-top: 6px; overflow: hidden; flex-shrink: 0; }
      .coin-item .progress-micro .fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
      .coin-item .coin-links { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding: 0 2px; flex-shrink: 0; }
      .coin-item .coin-links a { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 24px; border-radius: 4px; font-size: 10px; text-decoration: none; font-weight: bold; transition: 0.2s; line-height: 1; }
      .coin-item .coin-links .link-m { background: #ffaa0020; border: 1px solid #ffaa00; color: #ffaa00; }
      .coin-item .coin-links .link-m:hover { background: #ffaa0040; transform: scale(1.1); }
      .coin-item .coin-links .link-t { background: #1f2a3f; border: 1px solid #3f5185; color: #fff; }
      .coin-item .coin-links .link-t:hover { background: #2a3a55; transform: scale(1.1); }
      .coin-item .coin-links .vol-info { font-size: 10px; color: #6688aa; }
      .coin-item .predict-btn { background: #445566; border: none; color: #8899bb; padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.2s; }
      .coin-item .predict-btn:hover { background: #556677; }
      .coin-item .predict-btn.active { background: #ff6600; color: #fff; box-shadow: 0 0 15px rgba(255, 100, 0, 0.3); }
      .coin-item .predict-btn.active:hover { background: #ff8800; transform: scale(1.05); }
      .coin-item .predict-btn.done { opacity: 0.7; cursor: default; }
      .coin-item .predict-btn.done:hover { transform: none; }
      .coin-item .screenshot-btn { background: #ff8800; border: none; color: #fff; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; margin-left: 4px; transition: 0.2s; }
      .coin-item .screenshot-btn:hover { background: #ffaa44; transform: scale(1.05); }
      .toast { position: fixed; bottom: 30px; right: 30px; background: #1a2335; border: 1px solid #00ffaa; border-radius: 10px; padding: 14px 22px; color: #fff; font-size: 14px; z-index: 9999; display: none; box-shadow: 0 0 30px rgba(0, 255, 170, 0.15); max-width: 300px; }
      .toast.show { display: block; }
      .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: 99999; padding: 20px; backdrop-filter: blur(4px); overflow-y: auto; }
      .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; }
      .modal-content { background: #141b2b; border: 1px solid #253248; border-radius: 16px; padding: 20px; max-width: 1200px; width: 100%; max-height: none; position: relative; margin: auto; }
      .modal-content .modal-close { position: sticky; top: 0; float: right; background: 0; border: none; color: #ff4466; font-size: 32px; cursor: pointer; z-index: 10; transition: 0.2s; line-height: 1; margin-bottom: 10px; }
      .modal-content .modal-close:hover { transform: scale(1.3); }
      .modal-content .modal-title { font-size: 20px; font-weight: bold; color: #00ffaa; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; padding-right: 40px; flex-wrap: wrap; gap: 8px; }
      .modal-content .modal-title .symbol { color: #fff; }
      .modal-content .modal-title .gain { font-size: 18px; }
      .modal-content .modal-title .modal-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .modal-content .modal-chart { width: 100%; height: 80vh; min-height: 500px; }
      .modal-content .modal-vol { width: 100%; height: 80px; margin-top: 4px; }
      .modal-content .modal-links { display: flex; gap: 10px; margin-top: 12px; }
      .modal-content .modal-links a { flex: 1; padding: 8px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 12px; }
      .modal-content .modal-links .link-mexc { background: #ffaa0020; border: 1px solid #ffaa00; color: #ffaa00; }
      .modal-content .modal-links .link-tv { background: #1f2a3f; border: 1px solid #3f5185; color: #fff; }
      .modal-content .modal-btn { background: #445566; border: none; color: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
      .modal-content .modal-btn:hover { background: #556677; }
      .modal-content .modal-btn.active { background: #00ffaa; color: #000; }
      .modal-content .modal-btn.tf-active { background: #ff8800; color: #fff; box-shadow: 0 0 15px rgba(255, 136, 0, 0.3); }
      .modal-content .modal-btn.tf-active:hover { background: #ffaa44; }
      .coin-item.old-session { background: #2a2200; border-color: #aa8800; border-width: 2px; opacity: 0.85; }
      .coin-item.old-session .coin-gain { color: #ccaa44 !important; }
      .coin-item.old-session .top-badges .badge-icon { opacity: 0.8; }
      .coin-item.old-session .coin-chart { opacity: 0.9; }
      @media (max-width: 900px) { .list { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 600px) { .header { flex-direction: column; align-items: stretch; } .filters { flex-wrap: wrap; } .list { grid-template-columns: 1fr; } .modal-content .modal-chart { height: 50vh; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>🔪 Швейцарский нож трейдера <span>v16.0.0 «HTX Net»</span></h2>
        <div class="filters">
          <input type="number" id="vol" value="50000" placeholder="Объем" step="10000" />
          <select id="tf">
            <option value="5" selected>5 мин</option>
            <option value="15">15 мин</option>
            <option value="60">1 час</option>
          </select>
          <select id="duration">
            <option value="10">10 мин</option>
            <option value="15">15 мин</option>
            <option value="20">20 мин</option>
            <option value="30">30 мин</option>
            <option value="60" selected>60 мин</option>
            <option value="120">2 часа</option>
            <option value="180">3 часа</option>
            <option value="240">4 часа</option>
            <option value="300">5 часов</option>
            <option value="360">6 часов</option>
          </select>
          <button id="startBtn">🔍 СТАРТ</button>
          <button id="favBtn" class="btn-fav">⭐ ИЗБРАННОЕ</button>
          <button id="predBtn" class="btn-pred">🎯 ПРОГНОЗЫ</button>
          <button id="trainBtn" class="btn-train off">📊 ТРЕНИРОВКА OFF</button>
          <button id="sortBtn" class="btn-sort">📊 БЕЗ СОРТИРОВКИ</button>
          <button id="trendBtn" class="btn-trend off">📈 ТРЕНДЫ OFF</button>
          <button id="setupBtn" class="btn-setup off">🔧 СЕТАПЫ OFF</button>
          <button id="formBtn" class="btn-moment">🎯 МОМЕНТ</button>
          <button id="jsonBtn" class="btn-json">📋 JSON МОМЕНТЫ</button>
          <button id="jsonListBtn" class="btn-json" style="background: #ff8800;">📋 JSON ВЫДАЧА</button>
          <button id="screenshotPageBtn" class="btn-screenshot">📸 PNG</button>
          <button id="clearBtn" style="background: #ff4466">🗑 СБРОС</button>
        </div>
      </div>
      <div class="status" id="status"><span>⚡ Нажми «СТАРТ» для загрузки монет с HTX.</span></div>
      <div id="frozenPanel" style="display:none;margin-bottom:20px;padding:12px;background:linear-gradient(135deg,#001a2a,#002233);border:2px solid #00aaff;border-radius:12px;box-shadow:0 0 30px rgba(0,170,255,0.3);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="color:#88ddff;font-weight:bold;font-size:16px;">🧊 FROZEN СНИМОК <span id="frozenCount">0</span>/3</span>
          <button id="exportFrozenBtn" style="background:#00aaff;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer;">📋 ЭКСПОРТ</button>
        </div>
        <div id="frozenList" class="list" style="margin-bottom:0;"></div>
      </div>
      <div class="progress-container" id="progressContainer">
        <div class="time-remaining" id="timeRemaining">00:00 / 60:00</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="pagination" id="pagination">
        <button id="firstPageBtn" disabled>⏮ Первая</button>
        <button id="prevPageBtn" disabled>◀ Пред.</button>
        <span class="page-info" id="pageInfo">Страница 1 / 1</span>
        <button id="nextPageBtn" disabled>След. ▶</button>
        <button id="lastPageBtn" disabled>Последняя ⏭</button>
        <span class="stat-train" id="trainStats">🎯 Прогнозов: 0 | ⏳ 0 | ✅ 0 | ❌ 0</span>

      function normalizeHtxKlines(rawList) {

            parseFloat(k.low),

        }
        out.reverse(); // HTX: новые→старые → старые→новые
        return out;
      }

      function calcEMA(data, p) {
        const r = [];

        for (let i = 0; i < data.length; i++) {
          if (i === 0) ema = data[i];
          else ema = data[i] * k + ema * (1 - k);

      // ★ analyzeMicro — без изменений (формат свечей нормализован)
      function analyzeMicro(klines1m, coin) {
        if (!klines1m || klines1m.length < 3) return null;
        var momentTime = coin.momentCandleTime || (coin.form && coin.form.candleTime);
        if (!momentTime) return null;
        if (typeof momentTime === "string") momentTime = new Date(momentTime).getTime();
        if (!momentTime || isNaN(momentTime)) return null;
        var momentStart = momentTime + 5 * 60 * 1000;
        var momentEnd = momentTime + 10 * 60 * 1000;
        var insideCandles = [];
        for (var i = 0; i < klines1m.length; i++) {
          var t = parseInt(klines1m[i][0]);
          if (t >= momentStart && t < momentEnd) insideCandles.push(klines1m[i]);
        }
        if (insideCandles.length === 0) return null;
        var score = 0;
        var details = [];
        var greenCount = 0;
        for (var i = 0; i < insideCandles.length; i++) {
          var o = parseFloat(insideCandles[i][1]);
          var c = parseFloat(insideCandles[i][4]);
          if (c > o) greenCount++;
        }
        var greenRatio = greenCount / insideCandles.length;
        if (greenRatio >= 0.8) { score += 4; details.push("GREEN-" + greenCount + "/" + insideCandles.length); }
        else if (greenRatio >= 0.6) { score += 2; details.push("GREEN-" + greenCount + "/" + insideCandles.length); }
        else if (greenRatio >= 0.4) { score += 0; details.push("GREEN-MIX"); }
        else { score -= 2; details.push("GREEN-LOW"); }
        if (insideCandles.length >= 3) {
          var volFirst = parseFloat(insideCandles[0][5]);
          var volLast = parseFloat(insideCandles[insideCandles.length - 1][5]);
          if (volLast > volFirst * 1.3) { score += 3; details.push("VOL-UP"); }
          else if (volLast < volFirst * 0.7) { score -= 2; details.push("VOL-DOWN"); }
        }
        var upperShadowTotal = 0;
        for (var i = 0; i < insideCandles.length; i++) {
          var h = parseFloat(insideCandles[i][2]);
          var o = parseFloat(insideCandles[i][1]);
          var c = parseFloat(insideCandles[i][4]);
          var maxOC = Math.max(o, c);
          upperShadowTotal += (h - maxOC) / maxOC;
        }
        var avgUpperShadow = upperShadowTotal / insideCandles.length;
        if (avgUpperShadow < 0.002) { score += 2; details.push("NO-UPPER"); }
        else if (avgUpperShadow > 0.005) { score -= 2; details.push("UPPER-SHADOW"); }
        var lastInside = insideCandles[insideCandles.length - 1];
        var lastO = parseFloat(lastInside[1]);
        var lastC = parseFloat(lastInside[4]);
        if (lastC > lastO) { score += 3; details.push("LAST-GREEN"); }
        else { score -= 1; details.push("LAST-RED"); }
        if (insideCandles.length >= 3) {
          var firstC = parseFloat(insideCandles[0][4]);
          var lastC2 = parseFloat(insideCandles[insideCandles.length - 1][4]);
          if (lastC2 > firstC) { score += 2; details.push("INSIDE-UP"); }
          else if (lastC2 < firstC) { score -= 2; details.push("INSIDE-DOWN"); }
        }
        var verdict = "WEAK";
        if (insideCandles.length < 3) verdict = "WEAK";
        else if (score >= 9) verdict = "STRONG";
        else if (score >= 4) verdict = "MID";
        return {
          microScore: score, verdict: verdict, priority: score,
          details: details.join(" "), greenRatio: greenRatio,
          insideCount: insideCandles.length,
          structureOk: insideCandles.length >= 3 && parseFloat(insideCandles[insideCandles.length-1][4]) > parseFloat(insideCandles[0][4])
        };
      }

      // ★ runAutoMicroAnalysis — без изменений

          var _freeSlots = 3 - frozenCoins.length;
          var _toFreeze = _strongCandidates.slice(0, _freeSlots);
          for (var _sf = 0; _sf < _toFreeze.length; _sf++) {

                  var _aR = _aH - _aL;
                  if (_aH > _peak) _peak = _aH;

                    type: _aC > _aO ? "BULL" : (_aC < _aO ? "BEAR" : "FLAT"),
                    volRatio: _aV > 0 ? parseFloat((_aV / parseFloat(coin.klines[_ai - 1][5])).toFixed(2)) : 0
                  });

            });

            showToast("🧊 " + coin.symbol + " заморожена (" + frozenCoins.length + "/3)");
            renderFrozenPanel();

        } catch (e) { console.error("Auto micro error:", e); }
        finally { microLoading = false; }

      function copyToClipboard(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(successMsg || "📋 Скопировано: " + text));
        } else {
          const input = document.createElement("input");
          input.value = text;
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          document.body.removeChild(input);
          showToast(successMsg || "📋 Скопировано: " + text);
        }
      }

      // ★ renderCandleChart — без изменений (формат свечей уже Bybit-совместим)
      function renderCandleChart(containerId, klines, entryPrice, gain, predicted, symbol, mode) {
        const container = document.getElementById(containerId);
        if (!container) return;
        if (chartInstances[containerId]) {
          try { chartInstances[containerId].dispose(); } catch (e) {}
          delete chartInstances[containerId];
        }
        container.innerHTML = "";
        const chartContainer = document.createElement("div");
        chartContainer.className = "chart-container";
        chartContainer.style.cssText = "width:100%;height:280px;";
        const volContainer = document.createElement("div");
        volContainer.className = "vol-container";
        volContainer.style.cssText = "width:100%;height:55px;margin-top:-2px;";
        container.appendChild(chartContainer);
        container.appendChild(volContainer);
        if (!klines || klines.length < 2) {
          chartContainer.innerHTML = '<div style="color:#445566;font-size:12px;text-align:center;padding:20px;">Нет данных</div>';
          return;

        const chart = echarts.init(chartContainer, "dark");
        chartInstances[containerId + "_chart"] = chart;
        const volChart = echarts.init(volContainer, "dark");
        chartInstances[containerId + "_vol"] = volChart;
        const times = klines.map((k) => parseInt(k[0]));
        const coinSymbol = symbol || container.closest(".coin-item")?.getAttribute("data-symbol");
        let coin = null;
        if (coinSymbol) coin = allCoins.find((c) => c.symbol === coinSymbol);
        const entryIndex = coin ? getEntryIndex(coin) : klines.length - 1;
        const isMomentMode = formMode !== "none";

        if (isMomentMode && coin && coin.momentCandlePrice) entry = coin.momentCandlePrice;
        else if (isMomentMode && coin && coin.form && coin.form.entryPrice) entry = coin.form.entryPrice;
        else if (coin && coin._entryPrice) entry = coin._entryPrice;
        else entry = entryPrice || parseFloat(klines[entryIndex][4]);

          parseInt(k[0]),
          ((parseFloat(k[1]) - entry) / entry) * 100,
          ((parseFloat(k[4]) - entry) / entry) * 100,
          ((parseFloat(k[3]) - entry) / entry) * 100,
          ((parseFloat(k[2]) - entry) / entry) * 100,
